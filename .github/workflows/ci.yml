name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/barismarathon/devops-marathon-hello
  GITOPS_REPO: barisMarathon/devops-marathon-gitops
  GITOPS_KUSTOMIZATION: manifests/hello/kustomization.yaml

# Never run two deploys at once (they would race on the gitops commit)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PRs only build (no push); main builds and pushes
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Fail loudly instead of silently falling back to GITHUB_TOKEN (which can't write to the gitops repo)
      - name: Require deploy key
        env:
          KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: test -n "$KEY" || { echo "::error::GITOPS_DEPLOY_KEY secret is missing"; exit 1; }

      - name: Check out the gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Bump image tag
        run: |
          sed -i "s/^\(\s*newTag:\).*/\1 ${{ needs.build.outputs.tag }}/" "$GITOPS_KUSTOMIZATION"
          git diff

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_KUSTOMIZATION"
          git diff --cached --quiet && { echo "Tag unchanged, nothing to deploy"; exit 0; }
          git commit -m "deploy(hello): ${{ needs.build.outputs.tag }}"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
